<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Renato de Paula - Médico</title>
    <meta name="description" content="Dr. Renato de Paula, médico pela UFRJ: consultas com escuta ativa, olhar clínico e humano, e o treinamento Meditação Raiz para quem quer aprender a meditar com base científica, sem misticismo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carregada sem bloquear a renderização: começa como media="print"
         (não bloqueia) e vira "all" quando termina de carregar. Com
         font-display=swap, o texto aparece com a fonte do sistema antes e
         troca suavemente assim que a fonte chega, sem tela em branco. -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Fontes usadas só dentro de /comunidade (área de membros) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Google tag (gtag.js) e Meta Pixel: carregados via
         src/utils/loadThirdParty.js, chamado em main.jsx só depois do
         primeiro paint (requestIdleCallback / timeout de 3500ms). Estavam
         aqui como <script> bloqueante e apareciam no PageSpeed como
         render-blocking + "JS não usado" (Facebook 67KiB + Google 65KiB). -->
  </head>
  <body>
    <noscript>
      <img height="1" width="1" style="display: none" src="https://www.facebook.com/tr?id=3103393009870274&ev=PageView&noscript=1" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
